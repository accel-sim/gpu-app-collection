name: Test Build

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the mydev branch
  push:
    branches-ignore:
      - "gh-readonly-queue**"
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:  
  test-12-8:
    runs-on: ubuntu-latest
    container:
     image: ghcr.io/accel-sim/accel-sim-framework:Ubuntu-24.04-cuda-12.8-minimal

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: false  # This clones submodules
      
      - name: Build Apps
        run: |
             git config --global --add safe.directory /__w/gpu-app-collection/gpu-app-collection
             git submodule update --init -- src/cuda/cuda-samples
             git submodule update --init -- src/cuda/cutlass-bench
             /bin/bash test-build.sh ci

      - name: Print Successful Apps
        if: always()
        run: |
              echo "Built `ls bin/12.8/release | wc` Apps:"
              ls bin/12.8/release

  # The accel-sim org publishes no CUDA 13 image, so this job starts from the
  # stock NVIDIA devel image and installs what the minimal image would have
  # provided. 13.2 is the toolkit the Blackwell port was developed against.
  test-13-2:
    runs-on: ubuntu-latest
    container:
     image: nvidia/cuda:13.2.1-devel-ubuntu24.04
    env:
      CUDA_INSTALL_PATH: /usr/local/cuda
      BOOST_ROOT: /usr
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install build dependencies
        run: |
             apt-get update
             apt-get install -y --no-install-recommends \
               build-essential cmake git ca-certificates libboost-dev zlib1g-dev

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Build Apps
        run: |
             git config --global --add safe.directory /__w/gpu-app-collection/gpu-app-collection
             git submodule update --init -- src/cuda/cuda-samples
             git submodule update --init -- src/cuda/cutlass-bench
             /bin/bash test-build.sh ci

      - name: Print Successful Apps
        if: always()
        run: |
              echo "Built `ls bin/13.2/release | wc` Apps:"
              ls bin/13.2/release
