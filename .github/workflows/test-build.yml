name: Test Build

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the mydev branch
  push:
    branches-ignore:
      - "gh-readonly-queue**"
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:  
  test-12-6:
    runs-on: ubuntu-latest
    container:
     image: nvidia/cuda:12.6.3-cudnn-devel-ubuntu24.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git
      
      - uses: actions/checkout@v4
      
      - name: Build Apps
        run: |
             apt-get install -y scons libboost-all-dev wget python-is-python3 cmake freeglut3-dev
             export BOOST_ROOT=/usr/include/boost/
             export CUDA_INSTALL_PATH=/usr/local/cuda
             git config --global --add safe.directory /__w/gpu-app-collection/gpu-app-collection
             /bin/bash test-build.sh

      - name: Print Successful Apps
        if: always()
        run: |
              echo "Built `ls bin/12.6/release | wc` Apps:"
              ls bin/12.6/release
